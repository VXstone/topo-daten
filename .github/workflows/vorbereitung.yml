# Vorbereitung für Spurpläne und Regionalpläne (D. Eckenstein / Claude, 20.10.2026)
# Läuft nach dem monatlichen Datenabzug (Workflow "Bahndaten Schweiz") und von Hand.
# Ergebnis: Release "vorbereitung" mit Betriebspunkten, Gleisnummern, Ausschnitten und Änderungsliste;
# Status je Datensatz und Schritt in stand.json (Schlüssel "vorbereitung"), weil die Lauf-Logs ausserhalb nicht lesbar sind.
name: vorbereitung
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Bahndaten Schweiz"]
    types: [completed]
permissions:
  contents: write
jobs:
  vorbereiten:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q numpy scipy shapely

      - name: Daten holen (OSM-Abzug, Vormonat)
        id: osm
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p eingang aus
          gh release download daten -p schweiz_bahn.json.gz -D eingang
          gh release download vorbereitung -p schweiz_bahn_vorher.json.gz -D eingang || echo "kein Vormonat"
          ls -la eingang

      - name: SBB Open Data laden (Perronflächen, Perronkanten, Betriebspunkte)
        id: sbb
        continue-on-error: true
        run: python3 skripte/vorbereitung/sbb_laden.py eingang eingang/sbb_laden.json

      - name: Perronkanten verdichten (eine Zeile je Kante mit Gleisnummer)
        id: perronkanten
        continue-on-error: true
        run: python3 skripte/vorbereitung/perronkanten.py eingang/perronkante.geojson aus/perronkanten.json

      - name: Betriebspunkte (SBB) mit OSM-Stationen abgleichen
        id: betriebspunkte
        continue-on-error: true
        run: python3 skripte/vorbereitung/betriebspunkte.py eingang aus/betriebspunkte.json

      - name: Gleisnummern je Bahnhof (SBB vor OSM)
        id: gleisnummern
        continue-on-error: true
        run: python3 skripte/vorbereitung/gleisnummern.py eingang aus/betriebspunkte.json aus/gleisnummern.json

      - name: Ausschnitte je Region und Betriebspunkt
        id: ausschnitte
        continue-on-error: true
        run: python3 skripte/vorbereitung/ausschnitte.py eingang/schweiz_bahn.json.gz aus/betriebspunkte.json konfig/regionen.json aus

      - name: Änderungen gegenüber Vormonat
        id: aenderungen
        continue-on-error: true
        run: |
          if [ -f eingang/schweiz_bahn_vorher.json.gz ]; then
            python3 skripte/vorbereitung/aenderungen.py eingang/schweiz_bahn_vorher.json.gz eingang/schweiz_bahn.json.gz aus/betriebspunkte.json aus/aenderungen.json
          else echo '{"hinweis": "erster Lauf, kein Vergleich"}' > aus/aenderungen.json; fi

      - name: Release "vorbereitung" erneuern
        id: release
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp eingang/schweiz_bahn.json.gz aus/schweiz_bahn_vorher.json.gz
          for f in perronoberflache betriebspunkte; do          # Perronkanten-Rohdaten (~500 000 Punkte) nicht, verdichtet in perronkanten.json
            [ -f eingang/$f.geojson ] && gzip -c eingang/$f.geojson > aus/sbb_$f.geojson.gz || true
          done
          gh release view vorbereitung >/dev/null 2>&1 || gh release create vorbereitung -t "Vorbereitung Spurpläne" -n "automatisch"
          gh release upload vorbereitung aus/* --clobber

      - name: Stand festhalten (stand.json, Schlüssel "vorbereitung")
        if: always()
        env:
          LAUF: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SCHRITTE: "osm=${{ steps.osm.outcome }};sbb=${{ steps.sbb.outcome }};perronkanten=${{ steps.perronkanten.outcome }};betriebspunkte=${{ steps.betriebspunkte.outcome }};gleisnummern=${{ steps.gleisnummern.outcome }};ausschnitte=${{ steps.ausschnitte.outcome }};aenderungen=${{ steps.aenderungen.outcome }};release=${{ steps.release.outcome }}"
        run: |
          git pull --rebase origin main || true
          python3 skripte/vorbereitung/stand_schreiben.py eingang aus stand.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stand.json
          git commit -m "Vorbereitung: Stand $(date -u +%Y-%m-%dT%H:%MZ)" || echo "keine Änderung"
          git pull --rebase origin main && git push
