# Feedback-Seite bauen (D. Eckenstein 23.10.2026: «mehr in Git auslagern»). Claude holt nur noch die fertige Seite und
# veröffentlicht sie; an den Hinweisstellen (spurplan/hinweise.json) entstehen kleine PNG-Ausschnitte zum Prüfen.
# Quelle: spurplan/werkstatt/olten (Stand der Arbeitsordner, feedback/bauen.py) + Regionalpläne vom Branch «ergebnisse».
# Ergebnis: Branch «ergebnisse», Ordner ergebnisse/seite/ (index.html, plaene/<key>.svg, ausschnitte/<id>.png + index.json).
name: seite
on:
  workflow_dispatch:
    inputs:
      label: { description: "Label des Regionalplans Olten", required: false, default: "Region Olten" }
  push:
    branches: [main]
    paths: ["spurplan/werkstatt/**", "spurplan/hinweise.json", "spurplan/hinweise_offen.json", "spurplan/code/osm_abgleich.py", "spurplan/code/hinweis_abdeckung.py", "spurplan/code/ausschnitte.py", "spurplan/code/alle_plaene_pruefen.py", "spurplan/abnahmen.json"]
  workflow_run:
    workflows: ["regionen", "plaene", "pruefstand"]
    types: [completed]
permissions:
  contents: write
concurrency: { group: seite, cancel-in-progress: false }   # eigene Gruppe: in einer gemeinsamen Gruppe ersetzt ein wartender Lauf den anderen
# Gleiche Rechnung auf jedem Runner (5.11.2026: zwei seite-Läufe je Commit ergaben abwechselnd zwei Fassungen von Olten und
# Neuchâtel; lokal immer gleich – vermutlich unterschiedliche Runner-CPUs mit anderen OpenBLAS-Kerneln)
env:
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONHASHSEED: "0"
jobs:
  bauen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with: { ref: main }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: |
          sudo apt-get install -y -q libcairo2 >/dev/null
          pip install -q numpy scipy shapely svgpathtools cairosvg pillow
      - name: Regionalpläne vom Branch «ergebnisse» übernehmen
        run: |
          git fetch -q origin ergebnisse || true
          for r in $(git ls-tree --name-only origin/ergebnisse ergebnisse/ 2>/dev/null | grep '/region_' || true); do
            k=$(basename $r)
            git show origin/ergebnisse:$r/region.svg > spurplan/werkstatt/olten/feedback/$k.svg 2>/dev/null || rm -f spurplan/werkstatt/olten/feedback/$k.svg
            git show origin/ergebnisse:$r/bericht.json > spurplan/werkstatt/olten/feedback/${k}_bericht.json 2>/dev/null || rm -f spurplan/werkstatt/olten/feedback/${k}_bericht.json   # Kartenlabel (bauen.py)
            # Bahnhofspläne der Linien-Region als eigene Karten (9.11.2026)
            rr=${k#region_}; mkdir -p spurplan/werkstatt/olten/feedback/regionen/$rr
            for f in $(git ls-tree --name-only origin/ergebnisse $r/ | grep '_spurplan.svg$' || true); do git show origin/ergebnisse:$f > spurplan/werkstatt/olten/feedback/regionen/$rr/$(basename $f); done
          done
          # Bahnhöfe aus dem Workflow «plaene» (26.10.2026): Plan + Gesamtbericht für bauen.py
          git show origin/ergebnisse:ergebnisse/bericht.json > spurplan/werkstatt/olten/feedback/repo_bericht.json 2>/dev/null || true
          for b in $(python3 -c "import json;print(' '.join(k for k in json.load(open('spurplan/bahnhoefe.json')) if not k.startswith('_')))"); do
            git show origin/ergebnisse:ergebnisse/$b/spurplan.svg > spurplan/werkstatt/olten/feedback/repo_$b.svg 2>/dev/null || rm -f spurplan/werkstatt/olten/feedback/repo_$b.svg
            git show origin/ergebnisse:ergebnisse/$b/netz.json > spurplan/werkstatt/olten/feedback/repo_${b}_netz.json 2>/dev/null || rm -f spurplan/werkstatt/olten/feedback/repo_${b}_netz.json
            git show origin/ergebnisse:ergebnisse/$b/netz_befunde.json > /tmp/netzbef_$b.json 2>/dev/null || rm -f /tmp/netzbef_$b.json   # V1 Hinweis-Abdeckung
          done
          # Blaupausen-Prüfstand (8.11.2026): Kontaktbogen + Kartenlabel für den Plan «Prüfstand» (Werkzeugkasten)
          git show origin/ergebnisse:ergebnisse/pruefstand/pruefstand.svg > spurplan/werkstatt/olten/feedback/pruefstand.svg 2>/dev/null || rm -f spurplan/werkstatt/olten/feedback/pruefstand.svg
          git show origin/ergebnisse:ergebnisse/pruefstand/label.txt > spurplan/werkstatt/olten/feedback/pruefstand_label.txt 2>/dev/null || rm -f spurplan/werkstatt/olten/feedback/pruefstand_label.txt
          ls spurplan/werkstatt/olten/feedback/*.svg
      - name: Daten (Release «daten») für die OSM-Ausschnitte der Region Olten
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download daten -p schweiz_bahn.json.gz -D /tmp --clobber
      - name: Regionen Olten und Neuchâtel bauen (Bahnhofspläne + Regionalplan aus der Werkstatt, 26.10.2026)
        run: |
          mkdir -p /tmp/seite
          { lscpu | grep -E "Model name|Flags" | cut -c1-200; python3 -c "import numpy, scipy, shapely; print('numpy', numpy.__version__, 'scipy', scipy.__version__, 'shapely', shapely.__version__)"; python3 -c "import numpy; numpy.show_runtime()" 2>&1 | grep -iE "architecture|internal_api|num_threads" ; } > /tmp/seite/umgebung.txt 2>&1 || true
          python3 spurplan/code/region_olten_lauf.py --osm /tmp/schweiz_bahn.json.gz --bericht /tmp/seite/region_olten.json 2>&1 | tee /tmp/seite/region_olten_log.txt
          python3 spurplan/code/region_olten_lauf.py --konfig spurplan/werkstatt/ne/region_ne.json --bericht /tmp/seite/region_ne.json 2>&1 | tee /tmp/seite/region_ne_log.txt
      - name: Seite bauen und Ausschnitte
        working-directory: spurplan/werkstatt/olten
        env: { PLAENE_DIR: "/tmp/seite/plaene" }
        run: |
          set -o pipefail; mkdir -p /tmp/seite
          python3 feedback/bauen.py "${{ github.event.inputs.label || 'Region Olten' }}" feedback/region.svg 2>&1 | tee /tmp/seite/log.txt
          cp feedback/index.html /tmp/seite/
          python3 ../../code/ausschnitte.py /tmp/seite/plaene ../../hinweise.json /tmp/seite/ausschnitte 2>&1 | tee -a /tmp/seite/log.txt
      - name: Abgleich Plan gegen OSM und Hinweis-Abdeckung (V1, 12.11.2026, D. Eckenstein «wir übersehen was»)
        run: |
          # Netzmodelle (<key>.json) aller Pläne, die aus Code kommen: Repo-Bahnhöfe, Werkstatt Olten/NE, Linien-Regionen
          mkdir -p /tmp/seite/netz /tmp/seite/netzbefunde
          for f in spurplan/werkstatt/olten/feedback/repo_*_netz.json; do [ -f "$f" ] || continue; b=$(basename $f _netz.json); cp $f /tmp/seite/netz/${b#repo_}.json; done
          for d in spurplan/werkstatt/olten spurplan/werkstatt/ne; do for f in $d/*_netz.json; do [ -f "$f" ] || continue; cp $f /tmp/seite/netz/$(basename $f _netz.json).json; done; done
          for r in $(git ls-tree --name-only origin/ergebnisse ergebnisse/ | grep '/region_' || true); do rr=$(basename $r); rr=${rr#region_}
            for f in $(git ls-tree --name-only origin/ergebnisse $r/ | grep '_netz.json$' || true); do git show origin/ergebnisse:$f > /tmp/seite/netz/${rr}__$(basename $f _netz.json).json; done; done
          for f in /tmp/netzbef_*.json; do [ -f "$f" ] || continue; b=$(basename $f .json); cp $f /tmp/seite/netzbefunde/${b#netzbef_}.json; done
          ls /tmp/seite/netz | wc -l
          python3 spurplan/code/osm_abgleich.py --alle /tmp/seite/plaene /tmp/seite/netz --osm /tmp/schweiz_bahn.json.gz --out /tmp/seite/osm_abgleich 2>&1 | tee /tmp/seite/osm_abgleich_log.txt | tail -3
          python3 spurplan/code/hinweis_abdeckung.py spurplan/hinweise_offen.json /tmp/seite/plaene /tmp/seite/osm_abgleich,/tmp/seite/netzbefunde \
            --regel --messen --netz /tmp/seite/netz --json /tmp/seite/abdeckung.json --md /tmp/seite/abdeckung.md 2>&1 | tee -a /tmp/seite/log.txt | head -1
          tar czf /tmp/seite/netz.tgz -C /tmp/seite netz     # Netzmodelle gepackt behalten (für lokale Prüfungen), offen ~3 MB
          rm -rf /tmp/seite/netz /tmp/seite/netzbefunde
      - name: Regression über alle Pläne (6.11.2026, Befund Olten) – Tabelle, Differenzbilder, Einordnung, Kartenlabel
        run: |
          git fetch -q --depth 400 origin ergebnisse:refs/remotes/origin/ergebnisse -f || true
          SEIT=$(python3 -c "import json;print(json.load(open('spurplan/veroeffentlicht.json'))['ergebnisse'])" 2>/dev/null || true)
          python3 spurplan/code/alle_plaene_pruefen.py spurplan/abnahmen.json /tmp/seite/regression \
            --neu /tmp/seite/plaene --osm-abgleich /tmp/seite/osm_abgleich --seite /tmp/seite/index.html ${SEIT:+--seit $SEIT} 2>&1 | tee -a /tmp/seite/log.txt || true
      - name: Ergebnisse auf Branch «ergebnisse» (nur ergebnisse/seite ersetzen)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash -u -q || true
          if git rev-parse --verify origin/ergebnisse >/dev/null 2>&1; then git checkout -q -B ergebnisse origin/ergebnisse; else git checkout -q --orphan ergebnisse; git rm -rq --cached . || true; fi
          rm -rf ergebnisse/seite && mkdir -p ergebnisse && cp -r /tmp/seite ergebnisse/seite
          git add -A ergebnisse/seite
          git commit -qm "Seite $(date -u +%Y-%m-%dT%H:%MZ) (${{ github.sha }})" || echo "keine Änderung"
          git push -q origin ergebnisse || { sleep 20; git fetch -q origin ergebnisse && git rebase -q origin/ergebnisse && git push -q origin ergebnisse; }   # paralleler Lauf hat gerade gepusht
