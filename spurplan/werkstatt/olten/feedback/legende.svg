<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 836" width="1160" height="836" font-family="Fira Sans, Helvetica, Arial, sans-serif"><rect width="1160" height="836" fill="#fff"/><text x="20" y="40" font-size="24" font-weight="700" text-anchor="start" fill="#00862f">Zeichenerklärung</text><g transform="translate(20,60)"><path d="M10,32.0H140" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="182" y="86" font-size="15" font-weight="600" text-anchor="start" fill="#111">Hauptgleis</text><text x="182" y="103" font-size="11" font-weight="400" text-anchor="start" fill="#555">Gleis mit Personenverkehr: Strecken- und Perrongleise. Im</text><text x="182" y="117" font-size="11" font-weight="400" text-anchor="start" fill="#555">Regionalplan nur diese.</text><g transform="translate(580,60)"><path d="M10,32.0H140" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="742" y="86" font-size="15" font-weight="600" text-anchor="start" fill="#111">Nebengleis</text><text x="742" y="103" font-size="11" font-weight="400" text-anchor="start" fill="#555">Güter-, Abstell-, Dienst- und Anschlussgleise. In grossen Knoten</text><text x="742" y="117" font-size="11" font-weight="400" text-anchor="start" fill="#555">(Olten) im Regionalplan nur als Abgang angedeutet.</text><g transform="translate(20,144)"><path d="M10,43H140" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="28" width="90" height="6" rx="1.5" fill="#00862f"/><rect x="62" y="36" width="26" height="14" fill="#fff"/><text x="75" y="48" font-size="15" font-weight="400" text-anchor="middle" fill="#00862f">3</text></g><text x="182" y="170" font-size="15" font-weight="600" text-anchor="start" fill="#111">Perron und Gleisnummer</text><text x="182" y="187" font-size="11" font-weight="400" text-anchor="start" fill="#555">Grüner Balken = Perronkante; Zahl im weissen Feld = Gleisnummer.</text><g transform="translate(580,144)"><path d="M10,21H140" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M46.0,21Q50.0,21 52.0,24.5L60.7,39.5Q62.7,43 66.7,43H140" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="742" y="170" font-size="15" font-weight="600" text-anchor="start" fill="#111">Weiche</text><text x="742" y="187" font-size="11" font-weight="400" text-anchor="start" fill="#555">Ein Gleis zweigt von einem anderen ab (immer 60°).</text><g transform="translate(20,228)"><path d="M10,21H140" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M10,43H140" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M58.0,21Q62.0,21 64.0,24.5L72.7,39.5Q74.7,43 78.7,43" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="182" y="254" font-size="15" font-weight="600" text-anchor="start" fill="#111">Einfacher Spurwechsel</text><text x="182" y="271" font-size="11" font-weight="400" text-anchor="start" fill="#555">2 Weichen: Verbindung zwischen zwei parallelen Gleisen in eine</text><text x="182" y="285" font-size="11" font-weight="400" text-anchor="start" fill="#555">Richtung.</text><g transform="translate(580,228)"><path d="M10,21H140" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M10,43H140" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M26.0,43Q30.0,43 32.0,39.5L40.7,24.5Q42.7,21 46.7,21" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M48.7,21Q52.7,21 54.7,24.5L63.4,39.5Q65.4,43 69.4,43" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="742" y="254" font-size="15" font-weight="600" text-anchor="start" fill="#111">Doppelter Spurwechsel</text><text x="742" y="271" font-size="11" font-weight="400" text-anchor="start" fill="#555">4 Weichen: zwei Spurwechsel hintereinander, gegenläufig, mit</text><text x="742" y="285" font-size="11" font-weight="400" text-anchor="start" fill="#555">kleiner Zwischengerade.</text><g transform="translate(20,312)"><path d="M10,21H140" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M10,43H140" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M62.29829407782823,21L87.70170592217177,43" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M62.29829407782823,43L87.70170592217177,21" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="182" y="338" font-size="15" font-weight="600" text-anchor="start" fill="#111">Hosenträger</text><text x="182" y="355" font-size="11" font-weight="400" text-anchor="start" fill="#555">Gekreuzter Spurwechsel (auch Mittelstück): zwei Spurwechsel</text><text x="182" y="369" font-size="11" font-weight="400" text-anchor="start" fill="#555">übereinander, mit Kreuzung in der Mitte.</text><g transform="translate(580,312)"><path d="M10,32.0H140" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M62.0,9.484000000000002L88.0,54.516" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M77.5,32.0Q75.0,32.0 73.7,29.8" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round"/><path d="M87.0,29.0Q76.7,29.0 71.6,20.1" fill="none" stroke="#00862f" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round"/><path d="M72.5,32.0Q75.0,32.0 76.3,34.2" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round"/><path d="M63.0,35.0Q73.3,35.0 78.4,43.9" fill="none" stroke="#00862f" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round"/></g><text x="742" y="338" font-size="15" font-weight="600" text-anchor="start" fill="#111">DKW</text><text x="742" y="355" font-size="11" font-weight="400" text-anchor="start" fill="#555">Doppelte Kreuzungsweiche: die Schräge läuft gerade durch, zwei</text><text x="742" y="369" font-size="11" font-weight="400" text-anchor="start" fill="#555">Klammern in den stumpfen Winkeln (= Bogenfahrwege). An einem</text><g transform="translate(20,396)"><path d="M10,32.0H140" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M62.0,9.484000000000002L88.0,54.516" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M77.5,32.0Q75.0,32.0 73.7,29.8" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round"/><path d="M84.0,29.8Q76.3,29.8 72.4,23.1" fill="none" stroke="#111" stroke-opacity="0.55" stroke-width="1.4" stroke-linecap="round"/><path d="M72.5,32.0Q75.0,32.0 76.3,34.2" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round"/><path d="M66.0,34.2Q73.7,34.2 77.6,40.9" fill="none" stroke="#111" stroke-opacity="0.55" stroke-width="1.4" stroke-linecap="round"/></g><text x="182" y="422" font-size="15" font-weight="600" text-anchor="start" fill="#111">DKW Nebengleis</text><text x="182" y="439" font-size="11" font-weight="400" text-anchor="start" fill="#555">DKW nur zwischen Nebengleisen: gleiches Zeichen, kleiner und</text><text x="182" y="453" font-size="11" font-weight="400" text-anchor="start" fill="#555">grau.</text><g transform="translate(580,396)"><path d="M10,32.0H140" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M57.217611708959524,15L92.78238829104048,49" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="742" y="422" font-size="15" font-weight="600" text-anchor="start" fill="#111">Kreuzung</text><text x="742" y="439" font-size="11" font-weight="400" text-anchor="start" fill="#555">Zwei Gleise kreuzen ohne Verbindung (auch Überwerfung /</text><text x="742" y="453" font-size="11" font-weight="400" text-anchor="start" fill="#555">Unterführung).</text><g transform="translate(20,480)"><path d="M10,21H120" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="120" cy="21" r="4.5" fill="#00862f"/><path d="M10,43H100" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="100" cy="43" r="3.2" fill="#111"/></g><text x="182" y="506" font-size="15" font-weight="600" text-anchor="start" fill="#111">Prellbock</text><text x="182" y="523" font-size="11" font-weight="400" text-anchor="start" fill="#555">Gleisende (Stumpfgleis). Grün auf Hauptgleis, schwarz auf</text><text x="182" y="537" font-size="11" font-weight="400" text-anchor="start" fill="#555">Nebengleis.</text><g transform="translate(580,480)"><path d="M10,21H140" fill="none" stroke="#9a5b1e" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M10,43H70" fill="none" stroke="#9a5b1e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M70,43L82.70170592217177,21" fill="none" stroke="#9a5b1e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="742" y="506" font-size="15" font-weight="600" text-anchor="start" fill="#111">Meterspur</text><text x="742" y="523" font-size="11" font-weight="400" text-anchor="start" fill="#555">Schmalspurgleis (1000 mm), braun; ohne Verbindung zur</text><text x="742" y="537" font-size="11" font-weight="400" text-anchor="start" fill="#555">Normalspur. Dick = Strecken-/Perrongleis, dünn = Abstellgleis.</text><g transform="translate(20,564)"><path d="M10,32.0H120" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M120,28.0L129,32.0L120,36.0Z" fill="#111"/></g><text x="182" y="590" font-size="15" font-weight="600" text-anchor="start" fill="#111">Pfeil am Planrand</text><text x="182" y="607" font-size="11" font-weight="400" text-anchor="start" fill="#555">Nebengleis läuft über den Planausschnitt hinaus weiter.</text><g transform="translate(580,564)"><path d="M10,21H140" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M60,21L73,43.5" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M77.5,51.3L69.5,45.5L76.5,41.5Z" fill="#111"/></g><text x="742" y="590" font-size="15" font-weight="600" text-anchor="start" fill="#111">Seitlicher Abgang</text><text x="742" y="607" font-size="11" font-weight="400" text-anchor="start" fill="#555">Nebengleis verlässt den Plan seitlich (schräger Stummel mit</text><text x="742" y="621" font-size="11" font-weight="400" text-anchor="start" fill="#555">Pfeil).</text><g transform="translate(20,648)"><path d="M10,21H56.0Q60.0,21 62.0,24.5L70.7,39.5Q72.7,43 76.7,43H140" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="182" y="674" font-size="15" font-weight="600" text-anchor="start" fill="#111">Versatz (S-Kurve)</text><text x="182" y="691" font-size="11" font-weight="400" text-anchor="start" fill="#555">Gleis wechselt die Höhe ohne Weiche. Nur wo es nicht anders</text><text x="182" y="705" font-size="11" font-weight="400" text-anchor="start" fill="#555">geht.</text><g transform="translate(580,648)"><path d="M10,28.0H90" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M10,36.0H90" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="29.0" font-size="12" font-weight="400" text-anchor="start" fill="#00862f">Linie 450</text><text x="96" y="44.0" font-size="12" font-weight="400" text-anchor="start" fill="#00862f">Bern →</text></g><text x="742" y="674" font-size="15" font-weight="600" text-anchor="start" fill="#111">Streckenabgang</text><text x="742" y="691" font-size="11" font-weight="400" text-anchor="start" fill="#555">Ende des Plans: Liniennummer und Richtung (Regionalplan).</text><g transform="translate(20,732)"><path d="M10,32.0H140" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M58,25.0H92" fill="none" stroke="#00862f" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M58,39.0H92" fill="none" stroke="#00862f" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/><text x="75" y="19.0" font-size="11" font-weight="400" text-anchor="middle" fill="#00862f">Hägendorf</text></g><text x="182" y="758" font-size="15" font-weight="600" text-anchor="start" fill="#111">Haltestelle</text><text x="182" y="775" font-size="11" font-weight="400" text-anchor="start" fill="#555">Halt ohne Weichen: kurze Perronstriche beidseits (Regionalplan).</text><g transform="translate(580,732)"><path d="M10,21H140" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M10,29H70L83.0,51.516H140" fill="none" stroke="#00862f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="742" y="758" font-size="15" font-weight="600" text-anchor="start" fill="#111">Abzweigstelle</text><text x="742" y="775" font-size="11" font-weight="400" text-anchor="start" fill="#555">Verzweigung auf freier Strecke, ohne Bahnhof (Regionalplan).</text></svg>