<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 450" font-family="Fira Sans, Source Sans 3, Helvetica, Arial, sans-serif">
<rect width="1500" height="450" fill="#fff"/>
<text x="30" y="52" font-size="34" font-weight="600" fill="#16201a">Fragen an Dani</text>
<text x="30" y="84" font-size="17" fill="#5a665e">Antwort: Pin ins Feld mit «A», «B» oder eigenem Text. Vorschlag Claude jeweils A. Entscheide kommen danach in REGELN.md.</text>
<rect x="20" y="120" width="1460" height="320" rx="10" fill="#f4f7f5" stroke="#d2dad4"/>
<text x="40" y="158" font-size="24" font-weight="600" fill="#00862f">F6 · Gampelen: Spurwechsel Seite Neuchâtel</text>
<text x="40" y="182" font-size="14" fill="#5a665e">REGELN 0.1 (HT) · Plan gampelen</text>
<text x="40" y="212" font-size="16" fill="#16201a">Die Vorlage zeichnet westlich der Perrons einen</text>
<text x="40" y="233" font-size="16" fill="#16201a">Spurwechsel. OSM hat dort keine Weiche – die nächste liegt</text>
<text x="40" y="254" font-size="16" fill="#16201a">1,9 km westlich. Gibt es den Spurwechsel real?</text>
<text x="40" y="283" font-size="16" font-weight="600" fill="#16201a">A</text>
<text x="64" y="283" font-size="16" fill="#16201a">Nein – Spurwechsel weglassen (Plan = OSM, HT 6 -&gt; 0).</text>
<text x="40" y="310" font-size="16" font-weight="600" fill="#16201a">B</text>
<text x="64" y="310" font-size="16" fill="#16201a">Ja – er existiert, OSM ist unvollständig: bleibt,</text>
<text x="64" y="331" font-size="16" fill="#16201a">Gampelen kommt in die OSM-Ausnahmen.</text>
<text x="40" y="358" font-size="13" font-style="italic" fill="#5a665e">Gampelen ist abgenommen; ohne Antwort ändere ich nichts.</text>
